name: Publish to Raycast Store

on:
  # Called by the Release workflow once a new version has actually been cut,
  # and available on its own from the Actions tab to re-submit by hand.
  workflow_call:
    secrets:
      RAY_TOKEN:
        required: true
      RAYCAST_GITHUB_TOKEN:
        required: true
  workflow_dispatch:

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pick up the release commit the Release job just pushed, not the
          # caller's pre-release SHA.
          ref: main

      - uses: jdx/mise-action@v2

      - name: Validate
        run: mise run check

      - name: Publish
        env:
          RAY_TOKEN: ${{ secrets.RAY_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.RAYCAST_GITHUB_TOKEN }}
        run: npx ray publish -I
