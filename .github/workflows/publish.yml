name: Publish to Raycast Store

# Run by hand from the Actions tab, independently of Release. Publishing opens
# or updates a pull request against raycast/extensions for human review.
on:
  workflow_dispatch:

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Validate
        run: mise run check

      - name: Publish
        env:
          RAY_TOKEN: ${{ secrets.RAY_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.RAYCAST_GITHUB_TOKEN }}
        run: npx ray publish -I
