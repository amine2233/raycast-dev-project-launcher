name: Release

# Run by hand from the Actions tab. Publishing to the Store is a separate,
# independently triggered workflow.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the full history to work out the next version,
          # and authenticates with GITHUB_TOKEN rather than the checkout creds.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@v2

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release
